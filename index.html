  }

  }

    margin-top:9px;
    padding:13px 10px;
  }

/* v18: content:// 로 직접 열어도 적용되는 화면 크기 */

</style></head><body><main class="app"><h1>복리 계산기</h1><p class="sub compact-hide">원화(₩)와 달러($)를 선택할 수 있습니다.</p>
<label>금액 입력</label><div class="moneyline"><select id="currency"><option value="₩">₩</option><option value="$">$</option></select><input class="main" id="amount" type="text" inputmode="decimal" value="1,000,000"><div class="converted" id="amountConverted"></div></div>
<label>1회 수익률 입력 (%)</label><div class="editwrap"><input class="main" id="rate" type="number" inputmode="decimal" value="2.5"><span class="suffix">%</span></div>
<section class="results">
<div class="row"><span class="k">값</span><span class="v" id="value">₩ 1,000,000</span></div>
<div class="row"><span class="k">환산값</span><span class="v subvalue" id="valueConverted">-</span></div>
<div class="row"><span class="k">누적수익률</span><div class="editwrap"><input id="cum" class="edit" type="number" inputmode="decimal" value="63.861644"><span class="suffix">%</span></div></div>
<div class="row"><span class="k">계산 횟수</span><input id="count" class="edit count" type="number" inputmode="decimal" value="20" min="0"></div>
</section>
<div class="fxstatus" id="fxStatus">환율 확인 중…</div><div class="buttons"><button class="run" id="run">실행</button><button class="reset" id="reset">초기화</button></div><button class="auto" id="auto">자동실행 OFF</button>
<button class="prev" id="prev">직전값</button>
<div class="note compact-hide">₩ / $ 선택에 따라 네이버 환율 기준 환산값을 함께 표시합니다. 계산 횟수 또는 누적수익률을 직접 입력한 뒤 실행할 수 있습니다.</div></main>
<script>
const A=document.getElementById('amount');
const R=document.getElementById('rate');
const N=document.getElementById('count');
const C=document.getElementById('cum');
const V=document.getElementById('value');
const CUR=document.getElementById('currency');
const AUTO=document.getElementById('auto');
const AC=document.getElementById('amountConverted');
const VC=document.getElementById('valueConverted');
const FXS=document.getElementById('fxStatus');

let timer=null;
let last='count';

// 기본 환율: 인터넷 연결 전/최초 실행용.
// 온라인 확인 성공 시 localStorage에 최신 환율을 저장합니다.
let usdKrwRate=1380.50;
let fxRateTime='2026-08-29 06:34 네이버 확인값';
let fxIsLive=false;

function parseAmount(){
  return Number(String(A.value).replace(/,/g,'')) || 0;
}

function fmtNumber(x, max=2){
  if(!Number.isFinite(Number(x))) return '0';
  return Number(x).toLocaleString('ko-KR',{
    minimumFractionDigits:0,
    maximumFractionDigits:max
  });
}

function fmtMoney(x, symbol){
  return symbol+' '+fmtNumber(x,2);
}

function formatAmountInput(){
  const raw=String(A.value).replace(/,/g,'').replace(/[^\d.]/g,'');
  if(raw==='') return;
  const firstDot=raw.indexOf('.');
  let intPart= firstDot>=0 ? raw.slice(0,firstDot) : raw;
  let decPart= firstDot>=0 ? raw.slice(firstDot+1).replace(/\./g,'').slice(0,2) : '';
  intPart=intPart.replace(/^0+(?=\d)/,'') || '0';
  const n=Number(intPart);
  if(Number.isFinite(n)){
    A.value=n.toLocaleString('ko-KR') + (firstDot>=0 ? '.'+decPart : '');
  }
}

function valueNumeric(){
  const txt=String(V.textContent||'').replace(/[₩$,\s]/g,'');
  return Number(txt)||0;
}

function updateConverted(){
  const amount=parseAmount();
  const val=valueNumeric();

  if(CUR.value==='₩'){
    if(AC) AC.textContent='약 $ '+fmtNumber(amount/usdKrwRate,2);
    if(VC) VC.textContent='$ '+fmtNumber(val/usdKrwRate,2);
  }else{
    if(AC) AC.textContent='약 ₩ '+fmtNumber(amount*usdKrwRate,2);
    if(VC) VC.textContent='₩ '+fmtNumber(val*usdKrwRate,2);
  }
}

function showFxStatus(){
  if(!FXS) return;
  FXS.textContent='네이버 매매기준율: $1 = ₩'+fmtNumber(usdKrwRate,2)
    +(fxIsLive ? ' · 네이버 실시간 확인' : ' · 네이버 직전 확인값')
    +(fxRateTime ? ' ('+fxRateTime+')' : '');
}

function fromN(){
  const p=parseAmount();
  const r=Number(R.value)||0;
  const n=Number(N.value)||0;
  const f=Math.pow(1+r/100,n);
  const val=p*f;

  V.textContent=fmtMoney(val,CUR.value);
  C.value=Number(((f-1)*100).toFixed(2));

  updateConverted();
}

function fromC(){
  const p=parseAmount();
  const r=Number(R.value)||0;
  const c=Number(C.value)||0;
  const target=1+c/100;
  const val=p*target;

  V.textContent=fmtMoney(val,CUR.value);

  const base=1+r/100;
  if(target>0 && base>0 && base!==1){
    const n=Math.log(target)/Math.log(base);
    N.value=Number(n.toFixed(2));
  }else if(c===0){
    N.value=0;
  }

  updateConverted();
}

function calc(){
  if(last==='cum') fromC();
  else fromN();
}

function stop(){
  if(timer){
    clearInterval(timer);
    timer=null;
  }
  if(AUTO) AUTO.textContent='자동실행 OFF';
}

document.getElementById('run').onclick=()=>{
  last='count';
  let n=Number(N.value);
  if(!Number.isFinite(n) || n<0) n=0;
  N.value=Number((n+1).toFixed(2));
  fromN();
};

document.getElementById('reset').onclick=()=>{
  stop();
  // 금액, 통화, 1회 수익률은 현재 입력값을 그대로 유지
  N.value=0;
  C.value=0;
  last='count';
  fromN();
};

A.addEventListener('input',()=>{
  formatAmountInput();
  calc();
});

R.addEventListener('input',calc);

N.addEventListener('input',()=>{
  last='count';
  fromN();
});

C.addEventListener('input',()=>{
  last='cum';
  fromC();
});

CUR.addEventListener('change',()=>{
  calc();
  updateConverted();
});

AUTO.onclick=()=>{
  if(timer){
    stop();
    return;
  }
  AUTO.textContent='자동실행 ON';
  timer=setInterval(()=>{
    last='count';
    let n=Number(N.value)||0;
    N.value=Number((n+1).toFixed(2));
    fromN();
  },1000);
};

document.getElementById('prev').onclick=()=>{
  last='count';
  let n=Number(N.value);
  if(!Number.isFinite(n) || n<0) n=0;
  n=Math.max(0,n-1);
  N.value=Number(n.toFixed(2));
  fromN();
};


async function refreshFx(){
  // 네이버 전용 저장 키를 사용해 이전 일반환율 캐시와 섞이지 않게 합니다.
  const RATE_KEY='compoundNaverFxRateV2';
  const TIME_KEY='compoundNaverFxTimeV2';

  // 직전에 성공적으로 저장한 네이버 환율이 있으면 먼저 적용
  try{
    const saved=Number(localStorage.getItem(RATE_KEY));
    const savedTime=localStorage.getItem(TIME_KEY);
    if(Number.isFinite(saved) && saved>500 && saved<3000){
      usdKrwRate=saved;
      fxRateTime=savedTime||'직전 저장값';
    }
  }catch(e){}

  fxIsLive=false;
  showFxStatus();
  updateConverted();

  // 네이버 증권이 실제로 사용하는 USD/KRW JSON endpoint
  const naverApi='https://api.stock.naver.com/marketindex/exchange/FX_USDKRW';

  // 로컬(content://) 실행에서는 CORS가 막힐 수 있어
  // 1) 네이버 직접 호출 → 2) CORS 중계로 네이버 원본 호출 순서로 시도
  const sources=[
    {url:naverApi, mode:'json'},
    {url:'https://api.allorigins.win/raw?url='+encodeURIComponent(naverApi), mode:'json'}
  ];

  for(const src of sources){
    try{
      const res=await fetch(src.url,{cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data=await res.json();

      const info=(data && data.exchangeInfo) ? data.exchangeInfo : data;
      const raw=info && (info.closePrice || info.calcPrice);
      const rate=Number(String(raw||'').replace(/,/g,''));

      if(!Number.isFinite(rate) || rate<500 || rate>3000){
        throw new Error('네이버 환율값 오류');
      }

      usdKrwRate=rate;

      const traded=info && info.localTradedAt;
      const round=info && info.degreeCount;
      fxRateTime=traded
        ? traded.replace('T',' ').replace(/\+09:00$/,'') + (round ? ' · '+round+'회차' : '')
        : new Date().toLocaleString('ko-KR');

      fxIsLive=true;

      try{
        localStorage.setItem(RATE_KEY,String(rate));
        localStorage.setItem(TIME_KEY,fxRateTime);
      }catch(e){}

      break;
    }catch(e){}
  }

  showFxStatus();
  updateConverted();
}

// 최초 화면 계산
formatAmountInput();
fromN();
refreshFx();
</script></body></html>

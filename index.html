<script>
'use strict';
const $id=id=>document.getElementById(id);
const A=$id('amount'),R=$id('rate'),N=$id('count'),C=$id('cum'),V=$id('value'),CUR=$id('currency');
const AC=$id('amountConverted'),VC=$id('valueConverted'),TC=$id('thirdConverted');
const ML=$id('mainLabel'),CL=$id('convertedLabel'),TL=$id('thirdLabel'),FXS=$id('fxStatus'),AUTO=$id('auto');
const THEME=$id('themeToggle'),APP=$id('app');
function setPageMode(mode){const two=mode===2;APP.classList.toggle('page2',two);THEME.classList.toggle('spark',two);THEME.setAttribute('aria-label',two?'1번 페이지로 전환':'2번 페이지로 전환');THEME.innerHTML=two?'<span class="sparkle"></span>':'🦋';try{localStorage.setItem('s2_page',String(mode))}catch(e){}}
THEME.onclick=()=>setPageMode(APP.classList.contains('page2')?1:2);
const CREATOR_FINGERPRINT='ef83f390d87a8e28da50b76f';
const CREATOR_MARKS={"₩": "a7faf9b46921cb1cdef8", "$": "bcb3a8dbd4b5af7fe76f", "USDT": "3d0a3ad14bd2865ddf91", "CNY": "4919b84617e59c26c7de", "VND": "a8b0a2b49cc615a59f0e", "THB": "850ece83e796c40dae3e", "KHR": "bc450b212ff37f790244"};
function applyCreatorMark(){const app=$id('app');if(app)app.dataset.creatorMark=CREATOR_MARKS[CUR.value]||'';document.documentElement.dataset.creatorFingerprint=CREATOR_FINGERPRINT}
let timer=null,last='count',fxTimer=null;
let fxRefreshInFlight=null;

// Final: 기능 안정성을 우선한 간소화 버전. 저장 환율 즉시 표시 + 백그라운드 병렬 갱신.
// 앱을 연 현재 30분 구간의 성공 저장값이 있으면 재조회하지 않습니다.
// USD/CNY/VND/THB/KHR는 네이버, USDT는 업비트 KRW-USDT를 사용합니다.
const fx={
  USD:{rate:0,time:'',source:'네이버',live:false},
  USDT:{rate:0,time:'',source:'업비트',live:false},
  CNY:{rate:0,time:'',source:'네이버',live:false},
  VND:{rate:0,time:'',source:'네이버',live:false},
  THB:{rate:0,time:'',source:'네이버',live:false},
  KHR:{rate:0,time:'',source:'네이버',live:false}
};
const codes=['USD','CNY','VND','THB','KHR'];

function parseAmount(){return Number(String(A.value).replace(/,/g,''))||0}
function fmt(x,max=2){return Number(x||0).toLocaleString('ko-KR',{minimumFractionDigits:0,maximumFractionDigits:max})}
function rateFor(code){if(code==='₩')return 1;if(code==='$')return Number(fx.USD.rate)||0;return Number(fx[code]?.rate)||0}
function hasRate(code){return rateFor(code)>0}
function waitText(){return '환율 확인 중…'}
function currencyText(code,x){
  if(code==='₩')return '₩ '+fmt(x,2);
  if(code==='$')return '$ '+fmt(x,2);
  if(code==='VND')return '₫ '+fmt(x,2);
  return code+' '+fmt(x,2);
}
function formatAmountInput(){
  let raw=String(A.value).replace(/,/g,'').replace(/[^\d.]/g,''); if(raw==='')return;
  const p=raw.indexOf('.'); let i=p>=0?raw.slice(0,p):raw; let dec=p>=0?raw.slice(p+1).replace(/\./g,'').slice(0,2):'';
  i=i.replace(/^0+(?=\d)/,'')||'0'; const n=Number(i); if(Number.isFinite(n))A.value=n.toLocaleString('ko-KR')+(p>=0?'.'+dec:'');
}
function valueNumeric(){return Number(String(V.textContent).replace(/USDT|CNY|THB|KHR/g,'').replace(/[₩$₫,\s]/g,''))||0}
function setLabels(code){
  if(code==='₩'){ML.textContent='값';CL.textContent='$ 환산값';TL.textContent='USDT 환산값'}
  else if(code==='$'){ML.textContent='값';CL.textContent='₩ 환산값';TL.textContent='USDT 환산값'}
  else if(code==='USDT'){ML.textContent='값';CL.textContent='₩ 환산값';TL.textContent='$ 환산값'}
  else{ML.textContent='값';CL.textContent='₩ 환산값';TL.textContent='USDT 환산값'}
}
function updateConverted(){
  const code=CUR.value,amount=parseAmount(),val=valueNumeric(); setLabels(code);
  const usd=Number(fx.USD.rate)||0,usdt=Number(fx.USDT.rate)||0;
  if(code==='₩'){
    AC.textContent=usd?'약 $ '+fmt(amount/usd,2):waitText();
    VC.textContent=usd?'$ '+fmt(val/usd,2):'-';
    TC.textContent=usdt?'USDT '+fmt(val/usdt,2):'-';
  }else if(code==='$'){
    if(!usd){AC.textContent=waitText();VC.textContent='-';TC.textContent='-';return}
    const krwA=amount*usd,krwV=val*usd;
    AC.textContent='약 ₩ '+fmt(krwA,2); VC.textContent='₩ '+fmt(krwV,2); TC.textContent=usdt?'USDT '+fmt(krwV/usdt,2):'-';
  }else if(code==='USDT'){
    if(!usdt){AC.textContent=waitText();VC.textContent='-';TC.textContent='-';return}
    const krwA=amount*usdt,krwV=val*usdt;
    AC.textContent='약 ₩ '+fmt(krwA,2); VC.textContent='₩ '+fmt(krwV,2); TC.textContent=usd?'$ '+fmt(krwV/usd,2):'-';
  }else{
    const r=rateFor(code); if(!r){AC.textContent=waitText();VC.textContent='-';TC.textContent='-';return}
    const krwA=amount*r,krwV=val*r;
    AC.textContent='약 ₩ '+fmt(krwA,2); VC.textContent='₩ '+fmt(krwV,2); TC.textContent=usdt?'USDT '+fmt(krwV/usdt,2):'-';
  }
}
function showFxStatus(){
  const code=CUR.value;
  const info=code==='₩'||code==='$'?fx.USD:fx[code];
  if(!info||!info.rate){FXS.textContent=navigator.onLine?'환율 확인 중…':'저장된 환율 없음';return}
  const hhmm=(info.time||'').match(/(\d{2}:\d{2})(?::\d{2})?$/)?.[1]||'';
  FXS.textContent=(info.source||'네이버')+(hhmm?' · KST '+hhmm:'');
}
function fromN(){
  const p=parseAmount(),r=Number(R.value)||0,n=Math.max(0,Number(N.value)||0),f=Math.pow(1+r/100,n),val=p*f;
  V.textContent=currencyText(CUR.value,val); C.value=Number(((f-1)*100).toFixed(2)); updateConverted();
}
function fromC(){
  const p=parseAmount(),r=Number(R.value)||0,c=Number(C.value)||0,target=1+c/100,val=p*target;
  V.textContent=currencyText(CUR.value,val); const base=1+r/100;
  if(c===0)N.value=0; else if(target>0&&base>0&&base!==1)N.value=Number((Math.log(target)/Math.log(base)).toFixed(2));
  updateConverted();
}
function calc(){last==='cum'?fromC():fromN()}
function stop(){if(timer){clearInterval(timer);timer=null}AUTO.textContent='자동실행 OFF';AUTO.classList.remove('on')}
$id('run').onclick=()=>{last='count';N.value=Math.max(0,Number(N.value)||0)+1;fromN()};
$id('reset').onclick=()=>{stop();N.value=0;C.value=0;last='count';fromN()};
$id('prev').onclick=()=>{last='count';N.value=Math.max(0,(Number(N.value)||0)-1);fromN()};
AUTO.onclick=()=>{if(timer){stop();return}AUTO.textContent='자동실행 ON';AUTO.classList.add('on');timer=setInterval(()=>{last='count';N.value=(Number(N.value)||0)+1;fromN()},1000)};
A.addEventListener('input',()=>{formatAmountInput();calc()}); R.addEventListener('input',calc); N.addEventListener('input',()=>{last='count';fromN()}); C.addEventListener('input',()=>{last='cum';fromC()}); CUR.addEventListener('change',()=>{applyCreatorMark();calc();showFxStatus()});

const STORE_VER='v35';
const LEGACY_STORE_VERS=['v34','v33','v31','v30'];
function loadSaved(code){
  try{
    const versions=[STORE_VER,...LEGACY_STORE_VERS];
    for(const ver of versions){
      const r=Number(localStorage.getItem('fx_'+code+'_rate_'+ver));
      const t=localStorage.getItem('fx_'+code+'_time_'+ver);
      const slot=localStorage.getItem('fx_'+code+'_slot_'+ver);
      if(Number.isFinite(r)&&r>0){
        fx[code].rate=r;fx[code].time=t||'';fx[code].slot=slot||'';fx[code].live=false;
        if(ver!==STORE_VER)save(code);
        return true;
      }
    }
  }catch(e){}
  return false;
}
function save(code){try{localStorage.setItem('fx_'+code+'_rate_'+STORE_VER,String(fx[code].rate));localStorage.setItem('fx_'+code+'_time_'+STORE_VER,fx[code].time);localStorage.setItem('fx_'+code+'_slot_'+STORE_VER,fx[code].slot||currentKstSlot())}catch(e){}}
function kstNow(){
  const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
  const x=Object.fromEntries(parts.map(p=>[p.type,p.value])); return `${x.year}-${x.month}-${x.day} ${x.hour}:${x.minute}:${x.second}`;
}
function kstParts(){
  const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
  return Object.fromEntries(parts.map(p=>[p.type,p.value]));
}
function currentKstSlot(){
  const x=kstParts(),m=Number(x.minute)<30?'00':'30'; return `${x.year}-${x.month}-${x.day} ${x.hour}:${m}`;
}
function msUntilNextHalfHour(){
  const x=kstParts(),m=Number(x.minute),sec=Number(x.second),ms=new Date().getMilliseconds();
  const mins=(m<30?30-m:60-m); return Math.max(1000,mins*60000-sec*1000-ms+250);
}
function isCurrentSlot(code){return fx[code]?.slot===currentKstSlot()&&Number(fx[code]?.rate)>0}
function fetchJsonTimed(url,timeoutMs=1800){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeoutMs);
  return fetch(url,{cache:'no-store',headers:{'Accept':'application/json'},signal:controller.signal})
    .then(res=>{if(!res.ok)throw new Error('HTTP '+res.status);return res.json()})
    .finally(()=>clearTimeout(timer));
}
async function fetchJsonWithFallback(url){
  const bust=(url.includes('?')?'&':'?')+'_='+Date.now();
  const direct=url+bust;
  const proxy='https://api.allorigins.win/raw?url='+encodeURIComponent(direct);
  // 직통/대체 경로를 동시에 요청하고 먼저 성공한 응답만 사용합니다.
  // 2.4초 안에 새 값이 없으면 기존 저장값을 그대로 유지해 화면 대기를 만들지 않습니다.
  try{return await Promise.any([fetchJsonTimed(direct,1700),fetchJsonTimed(proxy,2400)])}
  catch(e){throw new Error('fetch failed')}
}
async function refreshNaver(code){
  const url='https://api.stock.naver.com/marketindex/exchange/FX_'+code+'KRW';
  try{
    const data=await fetchJsonWithFallback(url),info=data?.exchangeInfo||data;
    let rate=Number(String(info?.calcPrice??info?.closePrice??'').replace(/,/g,''));
    if(!Number.isFinite(rate)||rate<=0)throw new Error('bad rate');
    // 네이버 VND/KHR가 100단위로 내려오는 경우에만 1단위 KRW로 정규화
    const unitText=String(info?.unit??'');
    if((code==='VND'||code==='KHR') && rate>1 && (unitText.includes('100') || !info?.calcPrice)) rate/=100;
    fx[code].rate=rate;fx[code].time=kstNow();fx[code].slot=currentKstSlot();fx[code].source='네이버';fx[code].live=true;save(code);
    updateConverted();showFxStatus();
    return true;
  }catch(e){return false}
}
async function refreshUsdt(){
  // 네이버 외환 시장지표에는 USDT/KRW가 없으므로 USDT만 업비트 실제 KRW-USDT 체결가를 사용합니다.
  try{
    const url='https://api.upbit.com/v1/ticker?markets=KRW-USDT&_='+Date.now();
    const a=await fetchJsonTimed(url,1700),i=Array.isArray(a)?a[0]:null,r=Number(i?.trade_price);if(!Number.isFinite(r)||r<=0)throw new Error('bad rate');
    fx.USDT.rate=r;fx.USDT.time=kstNow();fx.USDT.slot=currentKstSlot();fx.USDT.source='업비트';fx.USDT.live=true;save('USDT'); updateConverted();showFxStatus(); return true;
  }catch(e){return false}
}
async function refreshDueRates(){
  if(fxRefreshInFlight)return fxRefreshInFlight;
  const naverDue=codes.filter(c=>!isCurrentSlot(c));
  const jobs=naverDue.map(c=>refreshNaver(c));
  if(!isCurrentSlot('USDT'))jobs.push(refreshUsdt());
  if(!jobs.length)return;
  fxRefreshInFlight=Promise.allSettled(jobs).finally(()=>{fxRefreshInFlight=null;updateConverted();showFxStatus()});
  return fxRefreshInFlight;
}
async function refreshAll(){
  // 이전 버전 저장값을 먼저 즉시 불러와 통화 선택 시 네트워크 응답을 기다리지 않게 합니다.
  ['USD','CNY','VND','THB','KHR','USDT'].forEach(loadSaved);
  updateConverted();showFxStatus();
  // USD/CNY/VND/THB/KHR/USDT 갱신은 동시에 시작하며 성공한 통화부터 조용히 교체합니다.
  refreshDueRates();
}
function scheduleFxBoundary(){
  if(fxTimer)clearTimeout(fxTimer);
  fxTimer=setTimeout(async()=>{await refreshDueRates();scheduleFxBoundary()},msUntilNextHalfHour());
}


// S2-29: 3번 일반 계산기. 1·2번 페이지의 기존 계산/환율 로직과 분리되어 동작합니다.
const CALC_ENTRY=document.getElementById('calcEntry');
const CALC_PAGE=document.getElementById('calculatorPage');
const CALC_CLOSE=document.getElementById('calcClose');
const CALC_DISPLAY=document.getElementById('calcDisplay');
const CALC_EXPR=document.getElementById('calcExpression');
const CALC_HISTORY_LIST=document.getElementById('calcHistoryList');
const CALC_HISTORY_RESET=document.getElementById('calcHistoryReset');
const CALC_HISTORY_KEY='s2_calc_history_v1';
let cHistory=[];
try{const saved=JSON.parse(localStorage.getItem(CALC_HISTORY_KEY)||'[]');if(Array.isArray(saved))cHistory=saved.slice(-10)}catch(e){}
function cHistoryRender(){
  if(!CALC_HISTORY_LIST)return;
  CALC_HISTORY_LIST.innerHTML='';
  if(!cHistory.length){const d=document.createElement('div');d.className='calc3-history-empty';d.textContent='계산기록이 없습니다';CALC_HISTORY_LIST.appendChild(d);return}
  cHistory.slice().reverse().forEach(t=>{const d=document.createElement('div');d.className='calc3-history-item';d.textContent=t;CALC_HISTORY_LIST.appendChild(d)});
}
function cHistorySave(){try{localStorage.setItem(CALC_HISTORY_KEY,JSON.stringify(cHistory))}catch(e){}cHistoryRender()}
function cHistoryAdd(text){cHistory.push(text);if(cHistory.length>10)cHistory.shift();cHistorySave()}
function cHistoryClear(){cHistory=[];cHistorySave()}
let cDisplay='0',cFirst=null,cOp=null,cWaiting=false,cJustEqual=false;
function cTrim(n){
  if(!Number.isFinite(n))return '오류';
  const a=Math.abs(n);
  if((a!==0&&a>=1e12)||(a!==0&&a<1e-9))return n.toExponential(8).replace(/\.0+e/,'e').replace(/(\.\d*?)0+e/,'$1e');
  const s=String(Number(n.toFixed(10)));
  return s.length>14?Number(n).toPrecision(10).replace(/\.0+$/,''):s;
}
function cRender(){CALC_DISPLAY.textContent=cDisplay;CALC_EXPR.textContent=cFirst!==null&&cOp?`${cTrim(cFirst)} ${cOp}`:''}
function cReset(){cDisplay='0';cFirst=null;cOp=null;cWaiting=false;cJustEqual=false;cRender()}
function cValue(){return Number(cDisplay.replace(/,/g,''))||0}
function cCompute(a,b,op){if(op==='+')return a+b;if(op==='−')return a-b;if(op==='×')return a*b;if(op==='÷')return b===0?NaN:a/b;return b}
function cInputDigit(d){if(cDisplay==='오류')cReset();if(cWaiting||cJustEqual){cDisplay=d;cWaiting=false;cJustEqual=false}else if(cDisplay==='0')cDisplay=d;else if(cDisplay.replace('-','').replace('.','').length<12)cDisplay+=d;cRender()}
function cDecimal(){if(cDisplay==='오류')cReset();if(cWaiting||cJustEqual){cDisplay='0.';cWaiting=false;cJustEqual=false}else if(!cDisplay.includes('.'))cDisplay+='.';cRender()}
function cOperator(op){if(cDisplay==='오류'){cReset();return}const v=cValue();if(cFirst===null)cFirst=v;else if(cOp&&!cWaiting){const r=cCompute(cFirst,v,cOp);cDisplay=cTrim(r);if(cDisplay==='오류'){cFirst=null;cOp=null;cWaiting=false;cRender();return}cFirst=Number(cDisplay)}cOp=op;cWaiting=true;cJustEqual=false;cRender()}
function cEquals(){if(cFirst===null||!cOp||cDisplay==='오류')return;const a=cFirst,op=cOp,b=cValue();const r=cCompute(a,b,op);const result=cTrim(r);if(result!=='오류')cHistoryAdd(`${cTrim(a)} ${op} ${cTrim(b)} = ${result}`);cDisplay=result;cFirst=null;cOp=null;cWaiting=false;cJustEqual=true;cRender()}
function cSign(){if(cDisplay==='오류')return;const v=cValue();cDisplay=cTrim(-v);cRender()}
function cPercent(){if(cDisplay==='오류')return;cDisplay=cTrim(cValue()/100);cRender()}
function cOpen(){CALC_PAGE.classList.add('open');CALC_PAGE.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
function cClose(){CALC_PAGE.classList.remove('open');CALC_PAGE.setAttribute('aria-hidden','true');document.body.style.overflow=''}
if(CALC_ENTRY)CALC_ENTRY.onclick=cOpen;
if(CALC_CLOSE)CALC_CLOSE.onclick=cClose;
if(CALC_HISTORY_RESET)CALC_HISTORY_RESET.onclick=cHistoryClear;
CALC_PAGE.addEventListener('click',e=>{const b=e.target.closest('.calc3-key');if(!b)return;if(b.dataset.digit!==undefined)cInputDigit(b.dataset.digit);else if(b.dataset.op)cOperator(b.dataset.op);else if(b.dataset.action==='decimal')cDecimal();else if(b.dataset.action==='clear')cReset();else if(b.dataset.action==='sign')cSign();else if(b.dataset.action==='percent')cPercent();else if(b.dataset.action==='equals')cEquals()});
window.addEventListener('keydown',e=>{if(!CALC_PAGE.classList.contains('open'))return;const k=e.key;if(/^\d$/.test(k))cInputDigit(k);else if(k==='.')cDecimal();else if(k==='+')cOperator('+');else if(k==='-')cOperator('−');else if(k==='*')cOperator('×');else if(k==='/'){e.preventDefault();cOperator('÷')}else if(k==='Enter'||k==='=')cEquals();else if(k==='Escape')cClose();else if(k==='Backspace'){if(cDisplay.length>1)cDisplay=cDisplay.slice(0,-1);else cDisplay='0';cRender()}else if(k==='Delete')cReset()});
cRender();
cHistoryRender();

setPageMode(1);formatAmountInput();applyCreatorMark();fromN();showFxStatus();refreshAll();scheduleFxBoundary();
window.addEventListener('focus',()=>{refreshDueRates()});
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
